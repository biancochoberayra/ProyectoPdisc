<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <style>
      .vender-container {
        max-width: 800px;
        margin: 3rem auto;
        padding: 2rem;
        background: var(--bl-surface);
        border: 1px solid var(--bl-border);
        border-radius: var(--bl-radius-xl);
        box-shadow: var(--bl-shadow-lg);
      }
      .vender-header {
        text-align: center;
        margin-bottom: 2rem;
      }
      .vender-header h1 {
        font-size: 2rem;
        color: var(--bl-primary-deeper);
        margin-bottom: 0.5rem;
      }
      .vender-header p {
        color: var(--bl-text-secondary);
      }
      .form-group {
        margin-bottom: 1.5rem;
      }
      .form-label {
        display: block;
        margin-bottom: 0.5rem;
        font-weight: 600;
        color: var(--bl-text);
      }
      .form-input {
        width: 100%;
        padding: 0.75rem 1rem;
        border: 1px solid var(--bl-border);
        border-radius: var(--bl-radius-md);
        font-family: inherit;
        font-size: 1rem;
        transition: border-color 0.2s;
      }
      .form-input:focus {
        outline: none;
        border-color: var(--bl-primary);
        box-shadow: 0 0 0 2px rgba(37,99,235,0.1);
      }
      .form-btn {
        width: 100%;
        padding: 1rem;
        background: var(--bl-primary);
        color: white;
        border: none;
        border-radius: var(--bl-radius-md);
        font-weight: 700;
        font-size: 1.125rem;
        cursor: pointer;
        transition: background 0.2s;
      }
      .form-btn:hover {
        background: var(--bl-primary-dark);
      }
      #status-view {
        display: none;
        text-align: center;
      }
      #status-view i {
        font-size: 3rem;
        color: var(--bl-primary);
        margin-bottom: 1rem;
      }
      .btn-outline {
        padding: 0.75rem 1.5rem;
        border: 2px solid var(--bl-primary);
        color: var(--bl-primary);
        border-radius: var(--bl-radius-md);
        font-weight: 600;
        cursor: pointer;
        background: transparent;
        transition: all 0.2s;
        margin-top: 1.5rem;
      }
      .btn-outline:hover {
        background: var(--bl-primary);
        color: white;
      }
      #dashboard-view {
        display: none;
      }
      .delivery-section-title {
        font-size: 1.25rem;
        color: var(--bl-text);
        margin-bottom: 1rem;
      }
      .delivery-list {
        display: flex;
        flex-direction: column;
        gap: 0.75rem;
      }
      .delivery-card {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: space-between;
        gap: 1rem;
        padding: 1rem;
        border: 1px solid var(--bl-border);
        border-radius: var(--bl-radius-md);
        background: var(--bl-surface-alt);
      }
      .delivery-card__info {
        display: flex;
        flex-direction: column;
        gap: 0.25rem;
      }
      .delivery-card__store {
        font-weight: 600;
      }
      .delivery-card__address {
        font-size: 0.875rem;
        color: var(--bl-text-secondary);
      }
      .delivery-empty {
        color: var(--bl-text-secondary);
        font-size: 0.9375rem;
      }

      @media (max-width: 768px) {
        .vender-container {
          margin: 1rem auto;
          padding: 1.25rem;
          border-radius: var(--bl-radius-lg);
        }
        .vender-header h1 {
          font-size: 1.5rem;
        }
        .delivery-card {
          justify-content: flex-start;
        }
      }
    </style>
    <script type="module" crossorigin src="/assets/repartidor-CSJaK3--.js"></script>
    <link rel="modulepreload" crossorigin href="/assets/speed-insights-BfAoLf6m.js">
    <link rel="modulepreload" crossorigin href="/assets/nav-utils-D7D42e1s.js">
    <link rel="modulepreload" crossorigin href="/assets/reviews-utils-kBUixdgf.js">
    <link rel="modulepreload" crossorigin href="/assets/support-utils-Cf9az3ec.js">
    <link rel="stylesheet" crossorigin href="/assets/auth-CDmIpMD7.css">
    <link rel="stylesheet" crossorigin href="/assets/home-DpC9GIj-.css">
  </head>
  <body>
    <!-- Loading screen -->
    <div id="loading-screen" class="auth-loading-screen">
      <div class="auth-loading-spinner"></div>
      <span class="auth-loading-text">Verificando sesión...</span>
    </div>

    <!-- Contenido principal -->
    <div id="main-content">
      <nav class="navbar">
        <div class="navbar__top">
          <a href="./home.html" class="navbar__logo">
            <img src="/assets/logoazulpng-BmcneNO6.png" alt="Baradero Local" class="navbar__logo-img" />
            <div class="navbar__logo-text">
              <span class="navbar__logo-title">Baradero Local</span>
              <span class="navbar__logo-subtitle">Baradero, más cerca que nunca</span>
            </div>
          </a>
          <div class="navbar__actions">
            <div id="nav-notifications-wrap"></div>
            <script>(function(){try{var w=document.getElementById('nav-notifications-wrap');if(w){var b=document.createElement('button');b.type='button';b.className='navbar__action-circle';b.id='nav-notifications';b.setAttribute('aria-label','Notificaciones');var i=document.createElement('i');i.className='fa-regular fa-bell';i.style.fontSize='0.875rem';b.appendChild(i);var s=document.createElement('span');s.className='cart-badge';s.id='notif-badge';b.appendChild(s);w.appendChild(b);}}catch(e){}})();</script>
            <a href="./home.html" class="navbar__action-circle" aria-label="Volver"><i class="fa-solid fa-arrow-left"></i></a>
          </div>
        </div>
      </nav>

      <main>
        <div class="vender-container">

          <!-- El formulario de auto-postulación ("Sumate como repartidor") se
               eliminó con el modelo de logística de terceros: al cadete lo da
               de alta su operador por email (add_courier). Sin puerta de
               entrada pública, no hay nada que un cliente común pueda hacer
               acá. Ver db/schema/64_close_delivery_access.sql. -->

          <!-- Vista de estado: sin alta de cadete / pausado / operador suspendido -->
          <div id="status-view">
            <i class="fa-solid fa-circle-info" id="status-icon"></i>
            <div class="vender-header">
              <h1 id="status-title">No estás dado de alta como cadete</h1>
              <p id="status-text">Para repartir tenés que estar dado de alta por un operador logístico o por el comercio con el que trabajás.</p>
            </div>
            <button type="button" class="btn-outline" id="btn-back-home">Volver al inicio</button>
          </div>

          <!-- Panel del cadete dado de alta -->
          <div id="dashboard-view">
            <div class="vender-header">
              <h1>Mis entregas</h1>
              <p id="courier-provider"></p>
              <p id="repartidor-rating" style="font-weight: 600; margin-top: 0.25rem;"></p>
            </div>

            <div id="my-deliveries-container" class="delivery-list">
              <!-- Cargado con JS -->
            </div>

            <!-- Soporte / reclamos (F12-11) -->
            <div style="margin-top: 2rem;">
              <div id="support-container"></div>
            </div>
          </div>

        </div>
      </main>

      <!-- Notificación Toast -->
      <div class="toast" id="toast" aria-live="polite" role="status"></div>
    </div>

  </body>
</html>
